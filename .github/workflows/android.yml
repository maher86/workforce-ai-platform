name: Android pilot
on:
  pull_request:
    branches: [dev, main, 'codex/**']
    paths: ['apps/android/**', 'apps/platform/resources/js/lib/*native*', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    env:
      WORKFORCE_ANDROID_ORIGIN: ${{ vars.WORKFORCE_ANDROID_PILOT_ORIGIN || 'https://workforce.invalid' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Generate exact-origin pilot assets
        run: npm run sync
      - name: Unit tests, Android lint and debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: APK checksum
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workforce-android-debug
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk.sha256

name: workforce-ai-platform

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
    target: development
  image: workforce-platform:development
  working_dir: /var/www/html
  # Preserve container env overrides; Laravel's reload mode discards them.
  command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
  volumes:
    - ./apps/platform:/var/www/html
    - ./infra/docker/uploads.ini:/usr/local/etc/php/conf.d/zz-workforce-uploads.ini:ro
    - node_modules:/var/www/html/node_modules
    - vendor:/var/www/html/vendor
  env_file:
    - ./apps/platform/.env
  environment: &app-environment
    APP_URL: http://localhost:${WORKFORCE_HTTP_PORT:-18000}
    WORKFORCE_PUBLIC_URL: ${WORKFORCE_PUBLIC_URL:-}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: workforce
    DB_USERNAME: workforce
    DB_PASSWORD: local-development-only
    PHP_CLI_SERVER_WORKERS: 4
    NODE_OPTIONS: --max-old-space-size=1536
    RAYON_NUM_THREADS: 2
    GOMAXPROCS: 2
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    REDIS_QUEUE_RETRY_AFTER: 180
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  init: true

services:
  preview:
    <<: *app
    profiles: ["preview"]
    environment:
      <<: *app-environment
      APP_URL: ${WORKFORCE_PUBLIC_URL:-http://localhost:18000}
      APP_DEBUG: "false"
      SESSION_COOKIE: workforce_preview_session
      SESSION_SECURE_COOKIE: "true"
      WORKFORCE_TRUSTED_PROXIES: ${WORKFORCE_TRUSTED_PROXIES:-}
    # Only cloudflared reaches this server; no host port is published.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["preview"]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://preview:8000"]
    init: true
  app:
    <<: *app
    ports:
      - "127.0.0.1:${WORKFORCE_HTTP_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 45s
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=120"]
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 135s
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
  node:
    <<: *app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    profiles: ["vite"]
    ports:
      - "127.0.0.1:5173:5173"
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/01-testing.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:${WORKFORCE_MAIL_PORT:-18025}:8025"

volumes:
  postgres_data:
  redis_data:
  node_modules:
  vendor:
